
<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Βιογραφικό Ιωάννας Παπαχρήστου</title>

  <style>
    body {
      margin: 0;
      background: #f7f8fc;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 15px;
      background: white;
      border-radius: 15px;
    }

    .cv-frame {
      width: 100%;
      height: 1200px;
      border: none;
      display: block;
    }

    .cv-link {
      text-align: center;
      margin: 20px 0;
    }

    .cv-link a {
      color: #71569B;
      font-weight: bold;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .container {
        margin: 10px;
        padding: 10px;
      }

      .cv-frame {
        height: 1400px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <iframe
      class="cv-frame"
      src="https://ioanna8888.github.io/my-cv/"
      title="Βιογραφικό Ιωάννας Παπαχρήστου">
    </iframe>

    <p class="cv-link">
      <a href="https://ioanna8888.github.io/my-cv/"
         target="_blank"
         rel="noopener noreferrer">
        Άνοιγμα βιογραφικού σε νέα καρτέλα ↗
      </a>
    </p>

  </div>

</body>
</html>
